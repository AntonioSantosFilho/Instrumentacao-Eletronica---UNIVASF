# Docker Compose para o sistema completo de monitoramento de vacinas
# Usa banco de dados DigitalOcean (configurado via .env)
version: "3.8"

services:
  # Aplicação Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Usar variáveis de ambiente do host ou arquivo .env (DigitalOcean)
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-25060}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-defaultdb}
      - MYSQL_SSL=${MYSQL_SSL:-true}
      - MYSQL_CA_CERT=${MYSQL_CA_CERT:-./ca-certificate.crt}
    volumes:
      # Montar certificado CA se necessário
      - ./ca-certificate.crt:/app/ca-certificate.crt:ro
    restart: unless-stopped
    networks:
      - vaccine-network

networks:
  vaccine-network:
    driver: bridge
