# Docker Compose para uso com banco de dados em nuvem (DigitalOcean, AWS RDS, etc.)
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Usar variáveis de ambiente do host ou arquivo .env
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-25060}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-defaultdb}
      - MYSQL_SSL=true
    restart: unless-stopped
    networks:
      - vaccine-network-cloud

networks:
  vaccine-network-cloud:
    driver: bridge
