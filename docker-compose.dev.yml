# Docker Compose para ambiente de desenvolvimento
# Usa banco de dados DigitalOcean (configurado via .env)
version: '3.8'

services:
  # Aplicação Next.js em modo desenvolvimento
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Usar variáveis de ambiente do host ou arquivo .env (DigitalOcean)
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-25060}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-defaultdb}
      - MYSQL_SSL=${MYSQL_SSL:-true}
      - MYSQL_CA_CERT=${MYSQL_CA_CERT:-./ca-certificate.crt}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      # Montar certificado CA se necessário
      - ./ca-certificate.crt:/app/ca-certificate.crt:ro
    restart: unless-stopped
    networks:
      - vaccine-network-dev

networks:
  vaccine-network-dev:
    driver: bridge
